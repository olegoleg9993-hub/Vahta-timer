name: Полёт Вахта — APK
on:
  push:
    branches: [flight-weather-v0.1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Проверить погодную оценку
        run: node --test flight-weather/tests/*.test.cjs
      - name: Собрать APK
        run: gradle -p flight-weather --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Polet-Vahta-0.17.0
          path: flight-weather/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
