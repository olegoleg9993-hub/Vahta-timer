name: Полёт Вахта — APK
on:
  push:
    branches: [flight-weather-v0.1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Проверить погодную оценку
        run: node tests/engine.test.cjs && node tests/forecast.test.cjs && node tests/cloud.test.cjs && node tests/index.test.cjs && node tests/audit.test.cjs
      - name: Собрать APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Polet-Vahta-0.5.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
