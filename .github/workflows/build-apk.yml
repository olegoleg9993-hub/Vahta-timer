name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать отладочный и релизный APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Выдать готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: Вахта-таймер-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Выдать APK для релизной подписи
        uses: actions/upload-artifact@v4
        with:
          name: Таймер-вахтовика-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Выдать инструменты подписи
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
          if-no-files-found: error
          retention-days: 30
